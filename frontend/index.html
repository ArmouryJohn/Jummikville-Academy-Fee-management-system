              </label>
            </div>

            <div class="mt-6 flex gap-3">
              <button @click="closeForm()"
                class="flex-1 rounded-xl border border-slate-200 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50">
                Cancel
              </button>
              <button @click="submitForm()" :disabled="submitting"
                class="flex-1 rounded-xl bg-brand-600 py-2.5 text-sm font-semibold text-white hover:bg-brand-700 disabled:opacity-50">
                <span x-show="!submitting" x-text="editing ? 'Save changes' : 'Create term'"></span>
                <span x-show="submitting" x-cloak>Saving…</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- ============================ REPORTS ============================ -->
      <section x-show="$store.app.screen === 'reports'" x-data="reports()">
        <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h1 class="gradient-heading text-xl font-semibold">Term Reports</h1>
            <p class="text-sm text-slate-500">A printable, shareable snapshot of how a term's money moved, or compare two terms side-by-side.</p>
          </div>
          <div class="inline-flex rounded-xl bg-slate-100 p-1">
            <button @click="mode = 'single'"
              :class="mode === 'single' ? 'bg-white font-semibold text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'"
              class="rounded-lg px-3 py-1.5 text-xs transition">
              Single Term Report
            </button>
            <button @click="mode = 'compare'; if (!comparison) loadComparison();"
              :class="mode === 'compare' ? 'bg-white font-semibold text-slate-900 shadow-sm' : 'text-slate-500 hover:text-slate-900'"
              class="rounded-lg px-3 py-1.5 text-xs transition">
              Term Comparison View
            </button>
          </div>
        </div>

        <!-- MODE SINGLE -->
        <div x-show="mode === 'single'">
          <!-- Term picker + downloads -->
          <div class="grad-card mb-6 rounded-2xl bg-white p-4 shadow-sm">
            <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
              <div class="w-full sm:max-w-xs">
                <label class="mb-1 block text-sm font-medium text-slate-700">Term</label>
                <select x-model.number="termId" @change="load()"
                  class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                  <template x-if="terms.length === 0">
                    <option value="">No terms yet</option>
                  </template>
                  <template x-for="t in terms" :key="t.id">
                    <option :value="t.id" x-text="t.name + (t.is_current ? ' (current)' : '')"></option>
                  </template>
                </select>
              </div>
              <div class="flex items-center gap-2" x-show="report">
                <a :href="`/api/v1/reports/terms/${termId}/export.pdf`" target="_blank" rel="noopener"
                  class="btn-depress inline-flex items-center gap-1.5 rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700">
                  ⬇ PDF
                </a>
                <a :href="`/api/v1/reports/terms/${termId}/export.csv`" target="_blank" rel="noopener"
                  class="btn-depress inline-flex items-center gap-1.5 rounded-xl border border-slate-200 px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50">
                  ⬇ CSV
                </a>
              </div>
            </div>
          </div>
        </div>

        <!-- MODE COMPARE -->
        <div x-show="mode === 'compare'" x-cloak>
          <!-- Term comparison picker -->
          <div class="grad-card mb-6 rounded-2xl bg-white p-4 shadow-sm">
            <div class="flex flex-col gap-4 sm:flex-row sm:items-end">
              <div class="flex-1">
                <label class="mb-1 block text-sm font-medium text-slate-700">Term A (Baseline)</label>
                <select x-model.number="termId1" @change="loadComparison()"
                  class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                  <template x-for="t in terms" :key="'t1-'+t.id">
                    <option :value="t.id" x-text="t.name + (t.is_current ? ' (current)' : '')"></option>
                  </template>
                </select>
              </div>
              <div class="hidden text-xl font-bold text-slate-400 sm:block mb-2">vs</div>
              <div class="flex-1">
                <label class="mb-1 block text-sm font-medium text-slate-700">Term B (Comparison)</label>
                <select x-model.number="termId2" @change="loadComparison()"
                  class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                  <template x-for="t in terms" :key="'t2-'+t.id">
                    <option :value="t.id" x-text="t.name + (t.is_current ? ' (current)' : '')"></option>
                  </template>
                </select>
              </div>
              <button @click="loadComparison()"
                class="btn-depress rounded-xl bg-brand-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">
                Compare
              </button>
            </div>
          </div>

          <!-- Comparison Loading -->
          <div x-show="loadingComparison" class="p-10 text-center text-sm text-slate-400">Comparing terms…</div>

          <!-- Comparison Results -->
          <div x-show="!loadingComparison && comparison" class="space-y-6">
            <div class="grad-card overflow-hidden rounded-2xl bg-white shadow-sm">
              <div class="border-b border-slate-100 px-5 py-4">
                <h2 class="text-base font-semibold text-slate-900">Side-by-Side Financial Summary</h2>
              </div>
              <table class="min-w-full divide-y divide-slate-100">
                <thead class="bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                  <tr>
                    <th class="px-5 py-3">Metric</th>
                    <th class="px-5 py-3 text-right" x-text="comparison?.term1.term_name"></th>
                    <th class="px-5 py-3 text-right" x-text="comparison?.term2.term_name"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-50 text-sm">
                  <tr class="lift-row">
                    <td class="px-5 py-3 font-medium text-slate-800">Total Expected Fees</td>
                    <td class="px-5 py-3 text-right text-slate-700" x-text="comparison?.term1.total_expected_display"></td>
                    <td class="px-5 py-3 text-right text-slate-700" x-text="comparison?.term2.total_expected_display"></td>
                  </tr>
                  <tr class="lift-row">
                    <td class="px-5 py-3 font-medium text-slate-800">Total Collected</td>
                    <td class="px-5 py-3 text-right font-semibold text-emerald-600" x-text="comparison?.term1.total_collected_display"></td>
                    <td class="px-5 py-3 text-right font-semibold text-emerald-600" x-text="comparison?.term2.total_collected_display"></td>
                  </tr>
                  <tr class="lift-row">
                    <td class="px-5 py-3 font-medium text-slate-800">Collection Rate</td>
                    <td class="px-5 py-3 text-right font-semibold text-slate-900" x-text="comparison?.term1.collection_rate + '%'"></td>
                    <td class="px-5 py-3 text-right font-semibold text-slate-900" x-text="comparison?.term2.collection_rate + '%'"></td>
                  </tr>
                  <tr class="lift-row">
                    <td class="px-5 py-3 font-medium text-slate-800">Outstanding Balances</td>
                    <td class="px-5 py-3 text-right text-slate-700" x-text="comparison?.term1.total_remaining_display"></td>
                    <td class="px-5 py-3 text-right text-slate-700" x-text="comparison?.term2.total_remaining_display"></td>
                  </tr>
                  <tr class="lift-row bg-slate-50/50">
                    <td class="px-5 py-3 font-medium text-slate-800">Total School Expenses</td>
                    <td class="px-5 py-3 text-right text-rose-600" x-text="comparison?.term1.total_expenses_display"></td>
                    <td class="px-5 py-3 text-right text-rose-600" x-text="comparison?.term2.total_expenses_display"></td>
                  </tr>
                  <tr class="lift-row bg-slate-50/80">
                    <td class="px-5 py-3 font-semibold text-slate-900">Net Available Funds</td>
                    <td class="px-5 py-3 text-right font-bold text-brand-600" x-text="comparison?.term1.net_available_display"></td>
                    <td class="px-5 py-3 text-right font-bold text-brand-600" x-text="comparison?.term2.net_available_display"></td>
                  </tr>
                  <tr class="lift-row">
                    <td class="px-5 py-3 font-medium text-slate-800">Enrolled Students</td>
                    <td class="px-5 py-3 text-right text-slate-700" x-text="comparison?.term1.students_total"></td>
                    <td class="px-5 py-3 text-right text-slate-700" x-text="comparison?.term2.students_total"></td>
                  </tr>
                  <tr class="lift-row">
                    <td class="px-5 py-3 font-medium text-slate-800">Paid / Partial / Unpaid</td>
                    <td class="px-5 py-3 text-right text-xs text-slate-600"
                        x-text="`${comparison?.term1.students_paid} paid · ${comparison?.term1.students_partial} partial · ${comparison?.term1.students_unpaid} unpaid`"></td>
                    <td class="px-5 py-3 text-right text-xs text-slate-600"
                        x-text="`${comparison?.term2.students_paid} paid · ${comparison?.term2.students_partial} partial · ${comparison?.term2.students_unpaid} unpaid`"></td>
                  </tr>
                  <tr class="lift-row">
                    <td class="px-5 py-3 font-medium text-slate-800">Paystack (Online) Payments</td>
                    <td class="px-5 py-3 text-right text-slate-700" x-text="`${comparison?.term1.channels.online_count} (${comparison?.term1.channels.online_amount_display})`"></td>
                    <td class="px-5 py-3 text-right text-slate-700" x-text="`${comparison?.term2.channels.online_count} (${comparison?.term2.channels.online_amount_display})`"></td>
                  </tr>
                  <tr class="lift-row">
                    <td class="px-5 py-3 font-medium text-slate-800">Manual (Cash/POS/Transfer) Payments</td>
                    <td class="px-5 py-3 text-right text-slate-700" x-text="`${comparison?.term1.channels.manual_count} (${comparison?.term1.channels.manual_amount_display})`"></td>
                    <td class="px-5 py-3 text-right text-slate-700" x-text="`${comparison?.term2.channels.manual_count} (${comparison?.term2.channels.manual_amount_display})`"></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>


        <!-- Loading -->
        <div x-show="loading" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
          <template x-for="i in 4" :key="i">
            <div class="h-24 animate-pulse rounded-2xl bg-slate-200/60"></div>
          </template>
        </div>

        <!-- Empty state -->
        <div x-show="!loading && !report"
             class="rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center">
          <p class="text-sm text-slate-500">Pick a term to see its report.</p>
          <p x-show="terms.length === 0" class="mt-1 text-xs text-slate-400">
            No terms exist yet — create one on the Terms screen first.
          </p>
        </div>

        <!-- Report preview -->
        <div x-show="!loading && report" x-cloak class="space-y-6">
          <!-- Headline totals -->
          <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <div class="tilt-card grad-card rounded-2xl bg-white p-5 shadow-sm">
              <p class="text-sm text-slate-500">Expected</p>
              <p class="mt-2 text-2xl font-bold text-slate-900" x-text="report.totals.total_expected_display"></p>
            </div>
            <div class="tilt-card grad-card rounded-2xl bg-white p-5 shadow-sm">
              <p class="text-sm text-slate-500">Collected</p>
              <p class="mt-2 text-2xl font-bold text-emerald-600" x-text="report.totals.total_collected_display"></p>
              <p class="mt-1 text-xs text-slate-400"><span x-text="report.totals.collection_rate"></span>% collection rate</p>
            </div>
            <div class="tilt-card grad-card rounded-2xl bg-white p-5 shadow-sm">
              <p class="text-sm text-slate-500">Outstanding</p>
              <p class="mt-2 text-2xl font-bold text-slate-700" x-text="report.totals.total_remaining_display"></p>
            </div>
            <div class="tilt-card grad-card rounded-2xl bg-white p-5 shadow-sm">
              <p class="text-sm text-slate-500">Overpaid</p>
              <p class="mt-2 text-2xl font-bold text-accent-600" x-text="report.totals.total_overpaid_display"></p>
            </div>
          </div>

          <!-- Student status strip -->
          <div class="grad-card rounded-2xl bg-white p-5 shadow-sm">
            <p class="mb-3 text-sm font-semibold text-slate-700">Students (<span x-text="report.totals.students_total"></span> with fees this term)</p>
            <div class="grid grid-cols-2 gap-3 sm:grid-cols-4">
              <div class="rounded-xl bg-emerald-50 p-3 text-center">
                <p class="text-lg font-bold text-emerald-700" x-text="report.totals.students_paid"></p>
                <p class="text-xs text-emerald-600">Paid</p>
              </div>
              <div class="rounded-xl bg-amber-50 p-3 text-center">
                <p class="text-lg font-bold text-amber-700" x-text="report.totals.students_partial"></p>
                <p class="text-xs text-amber-600">Partial</p>
              </div>
              <div class="rounded-xl bg-rose-50 p-3 text-center">
                <p class="text-lg font-bold text-rose-700" x-text="report.totals.students_unpaid"></p>
                <p class="text-xs text-rose-600">Unpaid</p>
              </div>
              <div class="rounded-xl bg-sky-50 p-3 text-center">
                <p class="text-lg font-bold text-sky-700" x-text="report.totals.students_overpaid"></p>
                <p class="text-xs text-sky-600">Overpaid</p>
              </div>
            </div>
          </div>

          <!-- By fee category -->
          <div class="grad-card overflow-hidden rounded-2xl bg-white shadow-sm">
            <div class="border-b border-slate-100 px-5 py-3">
              <h2 class="text-sm font-semibold text-slate-700">By fee category</h2>
            </div>
            <table class="min-w-full divide-y divide-slate-100">
              <thead class="bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                <tr>
                  <th class="px-5 py-2.5">Category</th>
                  <th class="px-5 py-2.5 text-right">Expected</th>
                  <th class="px-5 py-2.5 text-right">Collected</th>
                  <th class="px-5 py-2.5 text-right">Outstanding</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-50 text-sm">
                <template x-for="c in report.categories" :key="c.category_name">
                  <tr class="lift-row">
                    <td class="px-5 py-2.5 font-medium text-slate-800" x-text="c.category_name"></td>
                    <td class="px-5 py-2.5 text-right text-slate-600" x-text="c.expected_display"></td>
                    <td class="px-5 py-2.5 text-right text-emerald-600" x-text="c.collected_display"></td>
                    <td class="px-5 py-2.5 text-right text-slate-600" x-text="c.remaining_display"></td>
                  </tr>
                </template>
                <tr x-show="report.categories.length === 0">
                  <td colspan="4" class="px-5 py-4 text-center text-sm text-slate-400">No fee categories for this term.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- By class -->
          <div class="grad-card overflow-hidden rounded-2xl bg-white shadow-sm">
            <div class="border-b border-slate-100 px-5 py-3">
              <h2 class="text-sm font-semibold text-slate-700">By class</h2>
            </div>
            <table class="min-w-full divide-y divide-slate-100">
              <thead class="bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                <tr>
                  <th class="px-5 py-2.5">Section</th>
                  <th class="px-5 py-2.5">Class</th>
                  <th class="px-5 py-2.5 text-center">Students</th>
                  <th class="px-5 py-2.5 text-right">Expected</th>
                  <th class="px-5 py-2.5 text-right">Collected</th>
                  <th class="px-5 py-2.5 text-right">Outstanding</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-50 text-sm">
                <template x-for="(c, i) in report.classes" :key="i">
                  <tr class="lift-row">
                    <td class="px-5 py-2.5 text-slate-500" x-text="c.section"></td>
                    <td class="px-5 py-2.5 font-medium text-slate-800" x-text="c.class_name"></td>
                    <td class="px-5 py-2.5 text-center text-slate-600" x-text="c.students"></td>
                    <td class="px-5 py-2.5 text-right text-slate-600" x-text="c.expected_display"></td>
                    <td class="px-5 py-2.5 text-right text-emerald-600" x-text="c.collected_display"></td>
                    <td class="px-5 py-2.5 text-right text-slate-600" x-text="c.remaining_display"></td>
                  </tr>
                </template>
                <tr x-show="report.classes.length === 0">
                  <td colspan="6" class="px-5 py-4 text-center text-sm text-slate-400">No class data for this term.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- By payment method -->
          <div class="grad-card overflow-hidden rounded-2xl bg-white shadow-sm">
            <div class="border-b border-slate-100 px-5 py-3">
              <h2 class="text-sm font-semibold text-slate-700">By payment method</h2>
            </div>
            <div class="grid grid-cols-1 gap-3 px-5 py-4 sm:grid-cols-2">
              <div class="rounded-xl bg-brand-50 p-3">
                <p class="text-xs font-semibold uppercase tracking-wide text-brand-600">Online (Paystack)</p>
                <p class="mt-1 text-lg font-bold text-slate-900" x-text="report.channels.online_amount_display"></p>
                <p class="text-xs text-slate-500"><span x-text="report.channels.online_count"></span> payment(s)</p>
              </div>
              <div class="rounded-xl bg-slate-50 p-3">
                <p class="text-xs font-semibold uppercase tracking-wide text-slate-500">Manual (cash/POS/transfer)</p>
                <p class="mt-1 text-lg font-bold text-slate-900" x-text="report.channels.manual_amount_display"></p>
                <p class="text-xs text-slate-500"><span x-text="report.channels.manual_count"></span> payment(s)</p>
              </div>
            </div>
            <table class="min-w-full divide-y divide-slate-100">
              <thead class="bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                <tr>
                  <th class="px-5 py-2.5">Method</th>
                  <th class="px-5 py-2.5 text-center">Payments</th>
                  <th class="px-5 py-2.5 text-right">Amount</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-50 text-sm">
                <template x-for="m in report.methods" :key="m.method">
                  <tr class="lift-row">
                    <td class="px-5 py-2.5 font-medium text-slate-800" x-text="m.label"></td>
                    <td class="px-5 py-2.5 text-center text-slate-600" x-text="m.count"></td>
                    <td class="px-5 py-2.5 text-right text-slate-600" x-text="m.amount_display"></td>
                  </tr>
                </template>
                <tr x-show="report.methods.length === 0">
                  <td colspan="3" class="px-5 py-4 text-center text-sm text-slate-400">No payments recorded for this term yet.</td>
                </tr>
              </tbody>
            </table>
          </div>

          <!-- Reminder activity -->
          <div class="grad-card rounded-2xl bg-white p-5 shadow-sm">
            <h2 class="text-sm font-semibold text-slate-700">Reminder activity</h2>
            <p class="mt-2 text-2xl font-bold text-slate-900"><span x-text="report.reminders.reminders_sent"></span> <span class="text-base font-medium text-slate-500">sent</span></p>
            <p class="mt-1 text-xs text-slate-400" x-text="report.reminders.note"></p>
          </div>
        </div>
      </section>

      <!-- ========================================================= -->
      <!-- ==================== EXPENSES SCREEN ==================== -->
      <!-- ========================================================= -->
      <!--
        Money going OUT (fuel, repairs, textbooks, "Nepa Light", ...). Visible to
        and recordable by every admin; each row is stamped with who recorded it.
        Expenses reduce the school's Net Available on the Dashboard — they never
        touch any student's fee balance.
      -->
      <section x-show="$store.app.screen === 'expenses'" x-data="expenses()">
        <div class="mb-5 flex items-center justify-between">
          <div>
            <h1 class="gradient-heading text-xl font-semibold">Expenses</h1>
            <p class="text-sm text-slate-500">Money the school spends. Reduces Net Available on the dashboard — never a student's fees.</p>
          </div>
          <button @click="openCreate()"
            class="btn-depress inline-flex items-center gap-1.5 rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700">
            <span class="text-base leading-none">＋</span> Record expense
          </button>
        </div>

        <!-- Total spent summary line -->
        <div x-show="!loading" class="grad-card mb-6 rounded-2xl bg-white p-4 shadow-sm">
          <div class="flex items-center justify-between">
            <p class="text-sm text-slate-500">Total spent<span x-show="filterCategory"> · <span x-text="filterCategory"></span></span></p>
            <p class="text-lg font-bold text-rose-600" x-text="totalDisplay"></p>
          </div>
        </div>

        <!-- Category filter -->
        <div x-show="!loading" class="mb-4 flex flex-wrap gap-2">
          <button @click="setFilter('')"
            :class="filterCategory === '' ? 'bg-brand-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-100'"
            class="rounded-full border border-slate-200 px-3 py-1.5 text-xs font-semibold transition">All</button>
          <template x-for="cat in categories" :key="cat">
            <button @click="setFilter(cat)"
              :class="filterCategory === cat ? 'bg-brand-600 text-white' : 'bg-white text-slate-600 hover:bg-slate-100'"
              class="rounded-full border border-slate-200 px-3 py-1.5 text-xs font-semibold transition" x-text="cat"></button>
          </template>
        </div>

        <!-- Loading -->
        <div x-show="loading" class="space-y-2">
          <template x-for="i in 3" :key="i">
            <div class="h-16 animate-pulse rounded-xl bg-slate-200/60"></div>
          </template>
        </div>

        <!-- Empty state -->
        <div x-show="!loading && items.length === 0"
             class="rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center">
          <p class="text-sm text-slate-500">No expenses recorded yet.</p>
          <p class="mt-1 text-xs text-slate-400">Record what the school spends — fuel, repairs, textbooks, electricity — to track net funds.</p>
          <button @click="openCreate()"
            class="btn-depress mt-4 inline-flex items-center gap-1.5 rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">
            <span class="text-base leading-none">＋</span> Record your first expense
          </button>
        </div>

        <!-- Expenses table -->
        <div x-show="!loading && items.length > 0"
             class="grad-card overflow-hidden rounded-2xl bg-white shadow-sm">
          <table class="min-w-full divide-y divide-slate-100">
            <thead class="bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
              <tr>
                <th class="px-5 py-3">Date</th>
                <th class="px-5 py-3">Category</th>
                <th class="px-5 py-3">Purpose</th>
                <th class="px-5 py-3 text-right">Amount</th>
                <th class="px-5 py-3">Recorded by</th>
                <th class="px-5 py-3">Ref / Note</th>
                <th class="px-5 py-3"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-50 text-sm">
              <template x-for="e in items" :key="e.id">
                <tr class="lift-row">
                  <td class="px-5 py-3 whitespace-nowrap text-slate-600" x-text="fmtDate(e.expense_date)"></td>
                  <td class="px-5 py-3">
                    <span class="inline-flex rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-semibold text-slate-700" x-text="e.category"></span>
                  </td>
                  <td class="px-5 py-3 text-slate-900" x-text="e.purpose"></td>
                  <td class="px-5 py-3 text-right font-medium text-rose-600" x-text="e.amount_display"></td>
                  <td class="px-5 py-3 text-slate-500" x-text="e.created_by_email || '—'"></td>
                  <td class="px-5 py-3 text-slate-500">
                    <span x-show="e.receipt_ref" class="text-xs" x-text="e.receipt_ref"></span>
                    <span x-show="e.note" class="block text-xs text-slate-400" x-text="e.note"></span>
                    <span x-show="!e.receipt_ref && !e.note">—</span>
                  </td>
                  <td class="px-5 py-3">
                    <div class="flex items-center justify-end gap-1">
                      <button @click="openEdit(e)"
                        class="rounded-lg px-2 py-1 text-xs font-semibold text-slate-500 hover:bg-slate-100">Edit</button>
                      <button @click="remove(e)"
                        class="rounded-lg px-2 py-1 text-xs font-semibold text-slate-400 hover:bg-rose-50 hover:text-rose-600">Delete</button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- ============ CREATE / EDIT EXPENSE MODAL ============ -->
        <div x-show="formOpen" x-cloak class="fixed inset-0 z-50 flex items-end justify-center sm:items-center"
             @keydown.escape.window="closeForm()">
          <div class="absolute inset-0 bg-slate-900/40" @click="closeForm()"></div>
          <div class="relative w-full max-w-md rounded-t-2xl bg-white p-6 shadow-xl sm:rounded-2xl"
               x-transition:enter="transition ease-out duration-200"
               x-transition:enter-start="translate-y-8 opacity-0" x-transition:enter-end="translate-y-0 opacity-100">
            <div class="mb-4 flex items-center justify-between">
              <h2 class="text-base font-semibold text-slate-900" x-text="editing ? 'Edit expense' : 'Record expense'"></h2>
              <button @click="closeForm()" class="rounded-lg p-1 text-slate-400 hover:bg-slate-100">✕</button>
            </div>

            <div class="space-y-4">
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="mb-1 block text-sm font-medium text-slate-700">Category</label>
                  <select x-model="form.category"
                    class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20">
                    <template x-for="cat in categories" :key="cat">
                      <option :value="cat" x-text="cat"></option>
                    </template>
                  </select>
                </div>
                <div>
                  <label class="mb-1 block text-sm font-medium text-slate-700">Amount (₦)</label>
                  <input x-model.number="form.amount_naira" type="number" min="0" step="0.01" placeholder="15000"
                    class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
                </div>
              </div>
              <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Purpose</label>
                <input x-model="form.purpose" type="text" placeholder="e.g. Generator repair"
                  class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
              </div>
              <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Date</label>
                <input x-model="form.expense_date" type="date"
                  class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
              </div>
              <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Receipt ref <span class="text-slate-400">(optional)</span></label>
                <input x-model="form.receipt_ref" type="text" placeholder="Vendor slip / receipt number"
                  class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
              </div>
              <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Note <span class="text-slate-400">(optional)</span></label>
                <textarea x-model="form.note" rows="2" placeholder="Any extra detail"
                  class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20"></textarea>
              </div>
            </div>

            <div class="mt-6 flex gap-3">
              <button @click="closeForm()"
                class="flex-1 rounded-xl border border-slate-200 py-2.5 text-sm font-semibold text-slate-600 hover:bg-slate-50">
                Cancel
              </button>
              <button @click="submitForm()" :disabled="submitting"
                class="flex-1 rounded-xl bg-brand-600 py-2.5 text-sm font-semibold text-white hover:bg-brand-700 disabled:opacity-50">
                <span x-show="!submitting" x-text="editing ? 'Save changes' : 'Record expense'"></span>
                <span x-show="submitting" x-cloak>Saving…</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <!-- ========================================================= -->
      <!-- ============= PAYROLL & STAFF MANAGEMENT ================ -->
      <!-- ========================================================= -->
      <section x-show="$store.app.screen === 'payroll'" x-data="payroll()">
        <div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div>
            <h1 class="gradient-heading text-xl font-semibold">Staff Payroll & Directory 🔒</h1>
            <p class="text-sm text-slate-500">Manage staff profiles, bank details, term salary schedules, payouts, and term comparisons.</p>
          </div>
          <div class="flex items-center gap-2">
            <button @click="openAddStaff()"
              class="btn-depress inline-flex items-center gap-1.5 rounded-xl border border-slate-200 bg-white px-3.5 py-2 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50">
              <span class="text-base leading-none">＋</span> Add Staff Member
            </button>
            <button @click="openSalarySetup()"
              class="btn-depress inline-flex items-center gap-1.5 rounded-xl bg-brand-600 px-3.5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-700">
              <span class="text-base leading-none">⚙️</span> Assign Term Salary
            </button>
          </div>
        </div>

        <!-- Sub-navigation Tabs -->
        <div class="mb-5 flex border-b border-slate-200 gap-6 text-sm font-semibold">
          <button @click="subTab = 'overview'"
            :class="subTab === 'overview' ? 'border-b-2 border-brand-600 text-brand-700 pb-2.5' : 'text-slate-500 hover:text-slate-800 pb-2.5'">
            📊 Payroll Dashboard & Payouts
          </button>
          <button @click="subTab = 'staff'"
            :class="subTab === 'staff' ? 'border-b-2 border-brand-600 text-brand-700 pb-2.5' : 'text-slate-500 hover:text-slate-800 pb-2.5'">
            👨‍🏫 Staff Directory & Bank Details (<span x-text="staffList.length"></span>)
          </button>
          <button @click="subTab = 'compare'"
            :class="subTab === 'compare' ? 'border-b-2 border-brand-600 text-brand-700 pb-2.5' : 'text-slate-500 hover:text-slate-800 pb-2.5'">
            📈 Term Comparison View
          </button>
        </div>

        <!-- SUB-TAB 1: OVERVIEW & PAYOUTS -->
        <div x-show="subTab === 'overview'">
          <!-- Filter Bar -->
          <div class="grad-card mb-5 rounded-2xl bg-white p-4 shadow-sm">
            <div class="grid gap-3 sm:grid-cols-2 lg:grid-cols-5">
              <div>
                <label class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">Academic Term</label>
                <select x-model="termId" @change="loadSummary()"
                  class="w-full rounded-xl border border-slate-200 py-1.5 px-3 text-sm focus:border-brand-500 focus:outline-none">
                  <template x-for="t in terms" :key="t.id">
                    <option :value="t.id" x-text="t.name + (t.is_current ? ' (Current)' : '')"></option>
                  </template>
                </select>
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">Class Taught</label>
                <select x-model="filters.class_taught" @change="loadSummary()"
                  class="w-full rounded-xl border border-slate-200 py-1.5 px-3 text-sm focus:border-brand-500 focus:outline-none">
                  <option value="">All Classes</option>
                  <template x-for="c in Object.values(SECTION_CLASSES).flat()" :key="c">
                    <option :value="c" x-text="c"></option>
                  </template>
                </select>
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">Staff Role</label>
                <input x-model="filters.staff_role" @input.debounce.300ms="loadSummary()" type="text" placeholder="Teacher, Driver..."
                  class="w-full rounded-xl border border-slate-200 py-1.5 px-3 text-sm focus:border-brand-500 focus:outline-none" />
              </div>
              <div>
                <label class="mb-1 block text-xs font-medium uppercase tracking-wide text-slate-500">Payment Status</label>
                <select x-model="filters.payment_status" @change="loadSummary()"
                  class="w-full rounded-xl border border-slate-200 py-1.5 px-3 text-sm focus:border-brand-500 focus:outline-none">
                  <option value="">All Statuses</option>
                  <option value="paid">Fully Paid</option>
                  <option value="partial">Partially Paid</option>
                  <option value="unpaid">Unpaid</option>
                </select>
              </div>
              <div class="flex items-end">
                <button @click="downloadReportPdf()"
                  class="btn-depress w-full inline-flex items-center justify-center gap-1 rounded-xl border border-brand-200 bg-brand-50 py-1.5 px-3 text-xs font-semibold text-brand-700 hover:bg-brand-100">
                  📄 Print Term PDF Report
                </button>
              </div>
            </div>
          </div>

          <!-- Loading -->
          <div x-show="loading" class="space-y-2">
            <template x-for="i in 3" :key="i">
              <div class="h-16 animate-pulse rounded-xl bg-slate-200/60"></div>
            </template>
          </div>

          <!-- Summary Headline Cards -->
          <div x-show="!loading && summary" class="mb-6 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
            <div class="grad-card rounded-2xl bg-white p-4 shadow-sm">
              <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Total Staff Scheduled</p>
              <p class="mt-1 text-2xl font-bold text-slate-900" x-text="summary?.total_scheduled_display"></p>
              <p class="mt-1 text-xs text-slate-500" x-text="summary?.total_staff + ' active staff members'"></p>
            </div>
            <div class="grad-card rounded-2xl bg-white p-4 shadow-sm">
              <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Total Paid Out</p>
              <p class="mt-1 text-2xl font-bold text-emerald-600" x-text="summary?.total_paid_display"></p>
              <p class="mt-1 text-xs text-slate-500" x-text="summary?.staff_paid_count + ' fully paid'"></p>
            </div>
            <div class="grad-card rounded-2xl bg-white p-4 shadow-sm">
              <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Total Outstanding</p>
              <p class="mt-1 text-2xl font-bold text-amber-600" x-text="summary?.total_remaining_display"></p>
              <p class="mt-1 text-xs text-slate-500" x-text="summary?.staff_unpaid_count + ' unpaid / ' + summary?.staff_partial_count + ' partial'"></p>
            </div>
            <div class="grad-card rounded-2xl bg-white p-4 shadow-sm">
              <p class="text-xs font-medium uppercase tracking-wide text-slate-500">Completion Rate</p>
              <p class="mt-1 text-2xl font-bold text-brand-600" x-text="summary?.completion_rate + '%'"></p>
              <div class="mt-2 h-2 w-full overflow-hidden rounded-full bg-slate-100">
                <div class="h-full bg-brand-600 transition-all duration-500" :style="'width: ' + summary?.completion_rate + '%'"></div>
              </div>
            </div>
          </div>

          <!-- Empty state -->
          <div x-show="!loading && summary?.records.length === 0"
               class="rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center">
            <p class="text-sm text-slate-500">No staff payroll records found for this filter.</p>
            <button @click="openSalarySetup()"
              class="btn-depress mt-4 inline-flex items-center gap-1.5 rounded-xl bg-brand-600 px-4 py-2 text-sm font-semibold text-white hover:bg-brand-700">
              <span class="text-base leading-none">＋</span> Schedule Salary for Staff
            </button>
          </div>

          <!-- Payroll Table -->
          <div x-show="!loading && summary?.records.length > 0"
               class="grad-card overflow-hidden rounded-2xl bg-white shadow-sm">
            <table class="min-w-full divide-y divide-slate-100">
              <thead class="bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
                <tr>
                  <th class="px-4 py-3">Staff Member</th>
                  <th class="px-4 py-3">Role</th>
                  <th class="px-4 py-3">Classes</th>
                  <th class="px-4 py-3 text-right">Scheduled</th>
                  <th class="px-4 py-3 text-right">Paid Out</th>
                  <th class="px-4 py-3 text-right">Outstanding</th>
                  <th class="px-4 py-3">Status</th>
                  <th class="px-4 py-3 text-right">Actions</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-50 text-sm">
                <template x-for="r in summary?.records" :key="r.id">
                  <tr class="lift-row">
                    <td class="px-4 py-3 font-semibold text-slate-900">
                      <span x-text="r.staff_name"></span>
                      <p class="text-xs text-slate-400 font-normal" x-text="r.phone_number"></p>
                    </td>
                    <td class="px-4 py-3 text-slate-600" x-text="r.role_title"></td>
                    <td class="px-4 py-3 text-xs text-slate-500">
                      <template x-for="c in r.classes_taught" :key="c">
                        <span class="mr-1 inline-block rounded bg-slate-100 px-1.5 py-0.5 text-slate-700" x-text="c"></span>
                      </template>
                    </td>
                    <td class="px-4 py-3 text-right font-medium text-slate-900" x-text="r.amount_scheduled_display"></td>
                    <td class="px-4 py-3 text-right font-bold text-emerald-600" x-text="r.amount_paid_display"></td>
                    <td class="px-4 py-3 text-right font-semibold text-amber-600" x-text="r.remaining_display"></td>
                    <td class="px-4 py-3">
                      <span class="inline-flex rounded-full px-2.5 py-0.5 text-xs font-semibold"
                            :class="r.status === 'paid' ? 'bg-emerald-50 text-emerald-700' : (r.status === 'partial' ? 'bg-amber-50 text-amber-700' : 'bg-rose-50 text-rose-700')"
                            x-text="r.status.toUpperCase()"></span>
                    </td>
                    <td class="px-4 py-3 text-right">
                      <div class="flex items-center justify-end gap-1.5">
                        <button @click="openPayout(r)"
                                class="rounded-lg bg-brand-50 px-2.5 py-1 text-xs font-semibold text-brand-700 hover:bg-brand-100">
                          💳 Record Payout
                        </button>
                        <template x-if="r.payouts && r.payouts.length > 0">
                          <a :href="'/api/v1/payroll/' + r.payouts[0].id + '/payslip'" target="_blank"
                             class="rounded-lg border border-slate-200 px-2 py-1 text-xs text-slate-600 hover:bg-slate-50"
                             title="Download latest payslip PDF">
                            📄 PDF
                          </a>
                        </template>
                      </div>
                    </td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>

        <!-- SUB-TAB 2: STAFF DIRECTORY & BANK DETAILS -->
        <div x-show="subTab === 'staff'">
          <div class="mb-4 flex items-center justify-between">
            <h2 class="text-base font-semibold text-slate-900">Staff Roster & Bank Accounts</h2>
            <button @click="openAddStaff()"
              class="btn-depress inline-flex items-center gap-1.5 rounded-xl bg-brand-600 px-3.5 py-2 text-sm font-semibold text-white shadow-sm hover:bg-brand-700">
              <span class="text-base leading-none">＋</span> Add Staff Member
            </button>
          </div>

          <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">

              <span class="group inline-flex items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm">
                <span x-text="c.name"></span>
                <button @click="deleteCategory(c)"
                  class="text-slate-300 transition hover:text-rose-500"

            <p x-show="categories.length === 0" class="text-sm text-slate-400">No categories yet.</p>
          </div>
        </div>

        <!-- ============ FEE TYPES ============ -->

          </div>

              <span class="text-base leading-none">↻</span> Start new term
            </button>
            <button @click="openCreate()"
              class="btn-depress inline-flex items-center gap-1.5 rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700">
              <span class="text-base leading-none">＋</span> New fee type
            </button>
          </div>
        </div>

        <!-- Loading -->
        <div x-show="loading" class="space-y-2">
          <template x-for="i in 3" :key="i">

          </template>
        </div>

        <!-- Empty state -->
        <div x-show="!loading && feeTypes.length === 0"

          <p class="mt-1 text-xs text-slate-400">
            Create one (e.g. "Tuition · Primary · First Term"), then assign it to students from the Parents screen.
          </p>
          <button @click="openCreate()"
            class="btn-depress mt-4 inline-flex items-center gap-1.5 rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">

              <button @click="closeRollover()" class="rounded-lg p-1 text-slate-400 hover:bg-slate-100">✕</button>
            </div>

            <!-- Result summary (after a successful rollover) -->
            <div x-show="rolloverResult" x-cloak class="space-y-3">

                <label class="mb-1 block text-sm font-medium text-slate-700">Current term (roll from)</label>
                <input x-model="rolloverForm.from_term" type="text" list="existing-terms" placeholder="e.g. First Term 2025/2026"

                <label class="mb-1 block text-sm font-medium text-slate-700">New term (roll to)</label>

                    <option :value="s" x-text="s"></option>

      <section x-show="$store.app.screen === 'activity'" x-data="activity()">

    <!-- ================= DEPTH EFFECTS (parallax + tilt) =================
         Small, dependency-free, and defensive:
           • Bails out entirely if the user prefers reduced motion.
           • Uses only transform (GPU) and is throttled with requestAnimationFrame,
             so scroll and mouse-move stay at 60fps.
           • Tilt uses event delegation on document, so it works for cards Alpine
             adds/removes on the fly without re-binding.
         None of this touches app logic — it only reads scroll/cursor position
         and writes CSS transforms on decorative wrappers. -->
    <script>
      (function () {
        var reduce = window.matchMedia
          && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        if (reduce) return; // fully static UI for reduced-motion users

        // ---- Parallax: nudge each blob by scrollY * its data-depth ----
        var blobs = Array.prototype.slice.call(
          document.querySelectorAll(".parallax-blob")
        );
        var scrollQueued = false;
        function applyParallax() {
          scrollQueued = false;
          var y = window.scrollY || window.pageYOffset || 0;
          for (var i = 0; i < blobs.length; i++) {
            var d = parseFloat(blobs[i].getAttribute("data-depth")) || 0;
            blobs[i].style.transform = "translate3d(0," + (y * d) + "px,0)";
          }
        }
        window.addEventListener("scroll", function () {
          if (!scrollQueued) { scrollQueued = true; requestAnimationFrame(applyParallax); }
        }, { passive: true });
        applyParallax();

        // ---- 3D tilt: rotate the .tilt-card under the cursor a few degrees ----
        var MAX = 6;            // max tilt in degrees — deliberately gentle
        var tiltQueued = false;
        var pending = null;     // { card, ev }
        function applyTilt() {
          tiltQueued = false;
          if (!pending) return;
          var card = pending.card, ev = pending.ev;
          var r = card.getBoundingClientRect();
          var px = (ev.clientX - r.left) / r.width;   // 0..1 across
          var py = (ev.clientY - r.top) / r.height;   // 0..1 down
          var ry = (px - 0.5) * 2 * MAX;              // left/right → rotateY
          var rx = (0.5 - py) * 2 * MAX;              // up/down    → rotateX
          card.style.setProperty("--rx", rx.toFixed(2) + "deg");
          card.style.setProperty("--ry", ry.toFixed(2) + "deg");
        }
        document.addEventListener("mousemove", function (ev) {
          var card = ev.target.closest ? ev.target.closest(".tilt-card") : null;
          if (!card) return;
          pending = { card: card, ev: ev };
          if (!tiltQueued) { tiltQueued = true; requestAnimationFrame(applyTilt); }
        }, { passive: true });
        // Reset a card to flat when the cursor leaves it
        document.addEventListener("mouseout", function (ev) {
          var card = ev.target.closest ? ev.target.closest(".tilt-card") : null;
          if (!card) return;
          if (ev.relatedTarget && card.contains(ev.relatedTarget)) return;
          card.style.setProperty("--rx", "0deg");
          card.style.setProperty("--ry", "0deg");
        }, { passive: true });
      })();
    </script>

    <!-- PWA: register service worker for offline support + installability -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js')
            .then(function (reg) {
              console.log('[PWA] Service worker registered:', reg.scope);
            })
            .catch(function (err) {
              console.warn('[PWA] Service worker registration failed:', err);
            });
        });
      }
    </script>
