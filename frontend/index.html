<!DOCTYPE html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jummikville Academy — Fee Management</title>

    <!-- PWA: makes the app installable on Android, iOS, and desktop Chrome/Edge -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1e3a8a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jummikville" />
    <link rel="apple-touch-icon" href="/assets/images/icon-512.jpg" />

    <!--
      DEPENDENCIES (all via CDN — no build step):
      - Tailwind CSS : styling. The config block below sets our calm brand palette.
      - Alpine.js    : lightweight interactivity (the x-data / @click you see below).
      - Chart.js     : the paid/unpaid doughnut on the dashboard.
      - Inter font   : clean, trustworthy typeface suited to handling money.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              // Primary brand — a trustworthy blue (Tailwind blue shades).
              // Yellow (accent below) is reserved for attention moments only.
              brand: {
                50: "#eff6ff", 100: "#dbeafe", 500: "#3b82f6",
                600: "#2563eb", 700: "#1d4ed8", 800: "#1e40af", 900: "#1e3a8a",
              },
              // Accent — used sparingly for things that need attention.
              accent: {
                50: "#fefce8", 100: "#fef9c3", 500: "#eab308",
                600: "#ca8a04", 700: "#a16207",
              },
            },
            fontFamily: {
              sans: ["Inter", "system-ui", "sans-serif"],
            },
          },
        },
      };
    </script>
    <link rel="icon" type="image/jpeg" href="/assets/images/jummikville_logo.jpeg" />
    <link rel="apple-touch-icon" href="/assets/images/jummikville_logo.jpeg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <!--
      IMPORTANT: app.js must load BEFORE Alpine. Alpine's CDN build starts as
      soon as it loads (the document is already "interactive" for deferred
      scripts), firing its `alpine:init` event immediately. app.js registers our
      screens and store on that event, so it has to be parsed first — otherwise
      Alpine starts with nothing registered and hides every section (blank page).
    -->
    <script defer src="/app.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>

    <style>
      [x-cloak] { display: none !important; }
      body { font-family: "Inter", system-ui, sans-serif; }
      /* Subtle scrollbar for the drawer */
      .thin-scroll::-webkit-scrollbar { width: 6px; }
      .thin-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

      /* =====================================================================
         DEPTH / MOTION LAYER  (parallax + 3D tilt + gradients)
         Design rules that keep a money app trustworthy:
           • Effects live on decorative layers and card *chrome* — never on the
             numbers. Balance/fee text is always flat, opaque, high-contrast.
           • Everything is GPU-cheap (transform/opacity only) and rAF-throttled.
           • Anyone with "reduce motion" set gets a completely static UI.
         ===================================================================== */

      /* ---- Parallax background: soft palette blobs behind all content ---- */
      .parallax-bg {
        position: fixed; inset: 0; z-index: -1; overflow: hidden;
        pointer-events: none;               /* never intercept clicks */
      }
      .parallax-blob {
        position: absolute; border-radius: 9999px;
        filter: blur(60px); opacity: 0.5;
        will-change: transform;
        transform: translate3d(0,0,0);      /* promote to its own layer */
      }
      /* blue, ash, and a whisper of yellow — the palette, softened */
      .blob-1 { width: 42rem; height: 42rem; top: -10rem; left: -8rem;
                background: radial-gradient(circle at 30% 30%, #93c5fd, transparent 70%); }
      .blob-2 { width: 34rem; height: 34rem; top: 20rem; right: -10rem;
                background: radial-gradient(circle at 50% 50%, #dbeafe, transparent 70%); }
      .blob-3 { width: 28rem; height: 28rem; bottom: -8rem; left: 30%;
                background: radial-gradient(circle at 50% 50%, #fef9c3, transparent 72%);
                opacity: 0.35; }
      /* Content sits above the blobs */
      .depth-app { position: relative; z-index: 1; }

      /* ---- 3D tilt card ---- */
      /* The wrapper provides perspective; the inner .tilt-card rotates. Both
         transitions are short so a hovered card settles quickly and reads flat
         again the instant the cursor leaves. */
      .tilt-scene { perspective: 900px; }
      .tilt-card {
        transition: transform 220ms cubic-bezier(.2,.7,.3,1), box-shadow 220ms ease;
        transform-style: preserve-3d;
        will-change: transform;
      }
      .tilt-card:hover {
        box-shadow: 0 18px 40px -18px rgba(30, 58, 138, 0.35);
      }
      /* JS sets --rx/--ry from cursor position; default is flat (0/0). */
      .tilt-card { transform: rotateX(var(--rx, 0deg)) rotateY(var(--ry, 0deg)); }

      /* ---- Depth-lift for data-table rows & log items ---- */
      /* Wide rows of financial figures must NOT keystone (a 3D rotate shears the
         far-side numbers). So instead of .tilt-card, rows/log-items get a flat
         lift: they raise slightly with a soft shadow and a whisper of brand tint
         on hover. Depth cue, zero distortion — every digit stays square & sharp. */
      .lift-row {
        transition: transform 160ms ease, box-shadow 160ms ease, background-color 160ms ease;
      }
      .lift-row:hover {
        background-color: rgba(37, 99, 235, 0.045);
        box-shadow: 0 10px 24px -16px rgba(30, 58, 138, 0.45);
        transform: translateY(-1px);
      }

      /* ---- Gradient headings (headings ONLY, never numbers) ---- */
      .gradient-heading {
        background: linear-gradient(90deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }

      /* ---- Gradient border/wash on cards (chrome only) ---- */
      .grad-card {
        background:
          linear-gradient(#ffffff, #ffffff) padding-box,
          linear-gradient(135deg, rgba(37,99,235,.35), rgba(148,163,184,.18) 55%, rgba(234,179,8,.28)) border-box;
        border: 1px solid transparent;
      }

      /* ---- Section reveal: plays when the stat block re-mounts on tab switch ---- */
      @keyframes depthReveal {
        from { opacity: 0; transform: translateY(10px) scale(.985); }
        to   { opacity: 1; transform: translateY(0)    scale(1); }
      }
      .reveal-on-switch > * { animation: depthReveal 360ms cubic-bezier(.2,.7,.3,1) both; }
      /* Gentle stagger so cards cascade in rather than snapping together */
      .reveal-on-switch > *:nth-child(2) { animation-delay: 60ms; }
      .reveal-on-switch > *:nth-child(3) { animation-delay: 120ms; }
      .reveal-on-switch > *:nth-child(4) { animation-delay: 180ms; }

      /* ---- Button 3D depress ---- */
      .btn-depress { transition: transform 90ms ease, box-shadow 90ms ease; }
      .btn-depress:active { transform: translateY(2px) scale(.985); box-shadow: none; }

      /* ---- Respect the user's motion preference: kill ALL of the above ---- */
      @media (prefers-reduced-motion: reduce) {
        .parallax-blob { display: none; }
        .tilt-card { transform: none !important; transition: none; }
        .lift-row { transition: none; }
        .lift-row:hover { transform: none; }
        .reveal-on-switch > * { animation: none; }
        .btn-depress { transition: none; }
        .btn-depress:active { transform: none; }
      }
    </style>
  </head>

  <body class="h-full bg-slate-50 text-slate-800 antialiased" x-data>
    <!-- ================= PARALLAX BACKDROP =================
         Fixed, non-interactive palette blobs. JS nudges them at different
         speeds as you scroll (see the depth script at the end of <body>),
         giving the page a sense of depth behind the content. Purely
         decorative and hidden entirely under prefers-reduced-motion. -->
    <div class="parallax-bg" aria-hidden="true">
      <div class="parallax-blob blob-1" data-depth="0.12"></div>
      <div class="parallax-blob blob-2" data-depth="0.20"></div>
      <div class="parallax-blob blob-3" data-depth="0.08"></div>
    </div>

    <!-- =========================================================== -->
    <!-- ================= AUTH GATE =============================== -->
    <!-- =========================================================== -->
    <!--
      Everything below is gated on $store.auth.status:
      - 'checking' → brief spinner while GET /auth/me is in flight (avoids a
                     flash of the login form for already-logged-in users)
      - 'out'      → the login screen
      - 'in'       → the full app (header + main)
      x-cloak keeps all of this hidden until Alpine initialises.
    -->

    <!-- Initial auth check: a calm centered spinner -->
    <div x-cloak x-show="$store.auth.status === 'checking'"
         class="flex min-h-screen items-center justify-center">
      <svg class="h-8 w-8 animate-spin text-brand-600" viewBox="0 0 24 24" fill="none">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
      </svg>
    </div>

    <!-- ================= LOGIN SCREEN ================= -->
    <div x-cloak x-show="$store.auth.status === 'out'"
         class="flex min-h-screen items-center justify-center px-4">
      <div class="w-full max-w-sm" x-data="loginForm()">
        <div class="mb-6 flex flex-col items-center text-center">
          <img src="/assets/images/jummikville_logo.jpeg" alt="Jummikville Academy logo"
               class="mb-3 h-12 w-12 rounded-2xl object-contain" />
          <h1 class="text-lg font-semibold text-slate-900">Jummikville Academy</h1>
          <p class="text-sm text-slate-500">Sign in to the fee management dashboard.</p>
        </div>

        <form @submit.prevent="submit()"
              class="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
          <div class="space-y-4">
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700">Email</label>
              <input x-model="email" type="email" autocomplete="username" autofocus
                placeholder="you@jummikville.sch"
                class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
            </div>
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-700">Password</label>
              <input x-model="password" type="password" autocomplete="current-password"
                placeholder="••••••••"
                class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
            </div>

            <p x-show="error" x-cloak x-text="error"
               class="rounded-lg bg-rose-50 px-3 py-2 text-sm text-rose-700"></p>

            <button type="submit" :disabled="submitting"
              class="w-full rounded-xl bg-brand-600 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700 disabled:opacity-50">
              <span x-show="!submitting">Sign in</span>
              <span x-show="submitting" x-cloak>Signing in…</span>
            </button>
          </div>
        </form>
        <p class="mt-4 text-center text-xs text-slate-400">Powered by CAR Hub</p>
      </div>
    </div>

    <!-- =========================================================== -->
    <!-- ================= APP (authenticated only) ================ -->
    <!-- =========================================================== -->
    <template x-if="$store.auth.status === 'in'">
    <div>
    <!-- ================= TOP BAR ================= -->
    <header class="sticky top-0 z-30 border-b border-slate-200 bg-white/90 backdrop-blur">
      <div class="mx-auto flex max-w-6xl items-center justify-between px-4 py-3 sm:px-6">
        <div class="flex items-center gap-3">
          <img src="/assets/images/jummikville_logo.jpeg" alt="Jummikville Academy logo"
               class="h-9 w-9 rounded-xl object-contain" />
          <div>
            <p class="text-sm font-semibold leading-tight">Jummikville Academy</p>
            <p class="text-xs text-slate-500 leading-tight">Fee Management</p>
          </div>
        </div>

        <!-- Desktop nav -->
        <nav class="hidden items-center gap-1 sm:flex">
          <template x-for="tab in [
              {id:'dashboard', label:'Dashboard', directorOnly: false},
              {id:'parents', label:'Parents', directorOnly: false},
              {id:'terms', label:'Terms', directorOnly: false},
              {id:'reports', label:'Reports', directorOnly: false},
              {id:'expenses', label:'Expenses', directorOnly: false},
              {id:'payroll', label:'Payroll 🔒', directorOnly: true},
              {id:'admins', label:'Admins 🔒', directorOnly: true},
              {id:'setup', label:'Setup', directorOnly: false},
              {id:'activity', label:'Activity', directorOnly: false}
            ].filter(t => !t.directorOnly || $store.auth.isDirector)" :key="tab.id">
            <button
              @click="$store.app.go(tab.id)"
              :class="$store.app.screen === tab.id
                ? 'bg-brand-50 text-brand-700'
                : 'text-slate-600 hover:bg-slate-100'"
              class="rounded-lg px-3 py-1.5 text-sm font-medium transition"
              x-text="tab.label"></button>
          </template>
          <!-- Divider + who's-logged-in + logout -->
          <div class="ml-2 flex items-center gap-2 border-l border-slate-200 pl-3">
            <span class="hidden text-xs text-slate-500 md:inline" x-text="($store.auth.user?.email || '') + ($store.auth.isDirector ? ' (Director)' : ' (Staff Admin)')"></span>
            <button @click="$store.auth.logout()"
              class="rounded-lg px-3 py-1.5 text-sm font-medium text-slate-600 hover:bg-slate-100">
              Sign out
            </button>
          </div>
        </nav>
      </div>

      <!-- Mobile nav -->
      <nav class="border-t border-slate-100 sm:hidden">
        <div class="flex overflow-x-auto">
          <template x-for="tab in [
              {id:'dashboard', label:'Dashboard', directorOnly: false},
              {id:'parents', label:'Parents', directorOnly: false},
              {id:'terms', label:'Terms', directorOnly: false},
              {id:'reports', label:'Reports', directorOnly: false},
              {id:'expenses', label:'Expenses', directorOnly: false},
              {id:'payroll', label:'Payroll', directorOnly: true},
              {id:'admins', label:'Admins', directorOnly: true},
              {id:'setup', label:'Setup', directorOnly: false},
              {id:'activity', label:'Activity', directorOnly: false}
            ].filter(t => !t.directorOnly || $store.auth.isDirector)" :key="tab.id">
            <button
              @click="$store.app.go(tab.id)"
              :class="$store.app.screen === tab.id
                ? 'text-brand-700 border-brand-600'
                : 'text-slate-500 border-transparent'"
              class="flex-1 whitespace-nowrap border-b-2 px-3 py-2.5 text-sm font-medium transition"
              x-text="tab.label"></button>
          </template>
        </div>
        <!-- Who's logged in + logout (mobile) -->
        <div class="flex items-center justify-between border-t border-slate-100 px-4 py-2">
          <span class="text-xs text-slate-500" x-text="$store.auth.user?.email"></span>
          <button @click="$store.auth.logout()"
            class="rounded-lg px-3 py-1.5 text-xs font-medium text-slate-600 hover:bg-slate-100">
            Sign out
          </button>
        </div>
      </nav>
    </header>

    <main class="mx-auto max-w-6xl px-4 py-6 sm:px-6 sm:py-8">
      <!-- ========================================================= -->
      <!-- ================= DASHBOARD SCREEN ====================== -->
      <!-- ========================================================= -->
      <section x-show="$store.app.screen === 'dashboard'" x-data="dashboard()">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3">
          <div>
            <h1 class="gradient-heading text-xl font-semibold">Overview</h1>
            <p class="text-sm text-slate-500">A calm snapshot of fee collection.</p>
          </div>
          <button
            @click="sendReminders()"
            :disabled="sending || loading"
            class="btn-depress inline-flex items-center gap-2 rounded-xl bg-accent-500 px-4 py-2.5 text-sm font-semibold text-slate-900 shadow-sm transition hover:bg-accent-600 disabled:opacity-50">
            <span x-show="!sending">📩 Send Reminders Now</span>
            <span x-show="sending" x-cloak class="flex items-center gap-2">
              <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path>
              </svg>
              Sending…
            </span>
          </button>
        </div>

        <!-- Section switcher: whole-school vs one section. Reloads the numbers. -->
        <div class="mb-3 inline-flex flex-wrap rounded-xl bg-slate-100 p-1 text-sm">
          <template x-for="opt in [
              { id: 'all', label: 'Whole School' },
              { id: 'Preschool', label: 'Preschool' },
              { id: 'Primary', label: 'Primary' },
              { id: 'Smart Skills High School', label: 'Smart Skills High School' },
            ]" :key="opt.id">
            <button @click="switchSection(opt.id)"
              :disabled="loading"
              :class="section === opt.id && activeClass === null ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500'"
              class="btn-depress rounded-lg px-4 py-1.5 font-medium transition disabled:opacity-50"
              x-text="opt.label"></button>
          </template>
        </div>

        <!-- Class tab row (only shown when a section is active) -->
        <div x-show="section !== 'all' && classSummaries.length > 0" x-cloak class="mb-6">
          <!-- Breadcrumb when drilled into a class -->
          <div x-show="activeClass !== null" x-cloak class="mb-3 flex items-center gap-2 text-sm text-slate-500">
            <button @click="backToSection()"
              class="flex items-center gap-1 rounded-lg px-2 py-1 hover:bg-slate-100 text-brand-600 font-medium">
              Back to <span x-text="section"></span>
            </button>
            <span class="text-slate-300">/</span>
            <span class="font-semibold text-slate-800" x-text="activeClass"></span>
          </div>
          <!-- Class tabs -->
          <div x-show="activeClass === null" x-cloak class="flex flex-wrap gap-2">
            <template x-for="cls in classTabsForSection" :key="cls.class_name">
              <button @click="switchClass(cls.class_name)"
                :class="activeClass === cls.class_name ? 'bg-brand-600 text-white shadow-sm' : 'bg-white border border-slate-200 text-slate-600 hover:border-brand-400'"
                class="btn-depress inline-flex items-center gap-2 rounded-xl px-4 py-2 text-sm font-medium transition">
                <span x-text="cls.class_name"></span>
                <span x-show="cls.total_students > 0"
                  class="inline-flex items-center justify-center rounded-full px-1.5 py-0.5 text-xs font-semibold"
                  :class="classAttentionCount(cls) > 0 ? 'bg-accent-100 text-accent-700' : 'bg-emerald-50 text-emerald-700'">
                  <span x-show="classAttentionCount(cls) > 0" x-text="classAttentionCount(cls)"></span>
                  <span x-show="classAttentionCount(cls) === 0">all paid</span>
                </span>
                <span x-show="cls.total_students === 0" class="text-xs text-slate-400">empty</span>
              </button>
            </template>
          </div>
        </div>

        <!-- Loading skeleton -->
        <div x-show="loading" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
          <template x-for="i in 4" :key="i">
            <div class="h-28 animate-pulse rounded-2xl bg-slate-200/60"></div>
          </template>
        </div>

        <template x-if="!loading && summary">
          <div>
            <!-- The four headline numbers the school asked for. -->
            <!-- tilt-scene = perspective for the 3D hover. reveal-on-switch plays
                 the entrance animation whenever this block re-mounts — which the
                 outer x-if does on every tab switch (switchSection flips `loading`,
                 so !loading && summary briefly goes false then true). Numbers
                 themselves stay flat & solid. -->
            <div class="tilt-scene reveal-on-switch grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
              <div class="tilt-card grad-card rounded-2xl bg-white p-5 shadow-sm">
                <p class="text-sm text-slate-500">Total Fee</p>
                <p class="mt-2 text-2xl font-bold text-slate-900" x-text="summary.total_expected_display"></p>
                <p class="mt-1 text-xs text-slate-400">
                  <span x-text="summary.total_students"></span> student<span x-show="summary.total_students !== 1">s</span>
                </p>
              </div>
              <div class="tilt-card grad-card rounded-2xl bg-white p-5 shadow-sm">
                <p class="text-sm text-slate-500">Total Fee Collected</p>
                <p class="mt-2 text-2xl font-bold text-emerald-600" x-text="summary.total_collected_display"></p>
              </div>
              <div class="tilt-card grad-card rounded-2xl bg-white p-5 shadow-sm">
                <p class="text-sm text-slate-500">Total Fee Remaining</p>
                <p class="mt-2 text-2xl font-bold text-slate-700" x-text="summary.total_remaining_display"></p>
              </div>
              <div class="tilt-card grad-card rounded-2xl bg-white p-5 shadow-sm">
                <p class="text-sm text-slate-500">Total Overpaid</p>
                <p class="mt-2 text-2xl font-bold text-accent-600" x-text="summary.total_overpaid_display"></p>
                <p class="mt-1 text-xs text-slate-400">Credit to return to parents</p>
              </div>
            </div>

            <!-- Net funds (Part D): money OUT and what's actually left.
                 All-time, whole-school. Expenses reduce the school's cash
                 position — they NEVER change any student's fee balance. -->
            <div class="tilt-scene reveal-on-switch mt-4 grid gap-4 sm:grid-cols-2">
              <div class="tilt-card grad-card rounded-2xl bg-white p-5 shadow-sm">
                <p class="text-sm text-slate-500">Total Expenses</p>
                <p class="mt-2 text-2xl font-bold text-rose-600" x-text="summary.total_expenses_display"></p>
                <p class="mt-1 text-xs text-slate-400">School spending (all-time)</p>
              </div>
              <div class="tilt-card grad-card rounded-2xl bg-white p-5 shadow-sm">
                <p class="text-sm text-slate-500">Net Available</p>
                <p class="mt-2 text-2xl font-bold text-emerald-600" x-text="summary.net_available_display"></p>
                <p class="mt-1 text-xs text-slate-400">Collected − Expenses</p>
              </div>
            </div>

            <!-- Part F: Dashboard Insights -->
            <div x-show="summary.insights" x-cloak class="mt-6">
              <div class="mb-3 flex items-center gap-2">
                <span class="text-base">💡</span>
                <h3 class="text-sm font-semibold text-slate-800">Dashboard Insights</h3>
              </div>
              <div class="tilt-scene grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
                <!-- Top Unpaid Class -->
                <div class="tilt-card grad-card rounded-2xl bg-white p-4 shadow-sm">
                  <div class="flex items-center justify-between">
                    <p class="text-xs font-medium uppercase tracking-wide text-slate-400">Top Unpaid Class</p>
                    <span class="rounded-lg bg-amber-50 px-2 py-0.5 text-xs font-medium text-amber-700">Highest Owed</span>
                  </div>
                  <p class="mt-2 text-lg font-bold text-slate-800"
                     x-text="summary.insights.top_unpaid_class || 'None (All Paid)'"></p>
                  <p class="text-xs text-rose-600 font-semibold mt-1"
                     x-show="summary.insights.top_unpaid_class"
                     x-text="summary.insights.top_unpaid_class_remaining_display + ' outstanding'"></p>
                </div>

                <!-- Most Common Payment Method -->
                <div class="tilt-card grad-card rounded-2xl bg-white p-4 shadow-sm">
                  <div class="flex items-center justify-between">
                    <p class="text-xs font-medium uppercase tracking-wide text-slate-400">Popular Method</p>
                    <span class="rounded-lg bg-blue-50 px-2 py-0.5 text-xs font-medium text-blue-700">Payment Trend</span>
                  </div>
                  <p class="mt-2 text-lg font-bold text-slate-800"
                     x-text="summary.insights.most_common_payment_method || 'No payments yet'"></p>
                  <p class="text-xs text-slate-400 mt-1">Most used channel</p>
                </div>

                <!-- Biggest Expense Category -->
                <div class="tilt-card grad-card rounded-2xl bg-white p-4 shadow-sm">
                  <div class="flex items-center justify-between">
                    <p class="text-xs font-medium uppercase tracking-wide text-slate-400">Top Expense</p>
                    <span class="rounded-lg bg-rose-50 px-2 py-0.5 text-xs font-medium text-rose-700">Spend Leader</span>
                  </div>
                  <p class="mt-2 text-lg font-bold text-slate-800"
                     x-text="summary.insights.biggest_expense_category || 'No expenses'"></p>
                  <p class="text-xs text-rose-600 font-semibold mt-1"
                     x-show="summary.insights.biggest_expense_category"
                     x-text="summary.insights.biggest_expense_category_display + ' total'"></p>
                </div>

                <!-- Collection by Section -->
                <div class="tilt-card grad-card rounded-2xl bg-white p-4 shadow-sm">
                  <div class="flex items-center justify-between mb-2">
                    <p class="text-xs font-medium uppercase tracking-wide text-slate-400">Section Rates</p>
                    <span class="rounded-lg bg-emerald-50 px-2 py-0.5 text-xs font-medium text-emerald-700">Breakdown</span>
                  </div>
                  <div class="space-y-1.5">
                    <template x-for="(rate, secName) in summary.insights.collection_by_section" :key="secName">
                      <div class="flex items-center justify-between text-xs">
                        <span class="text-slate-600 truncate max-w-[110px]" x-text="secName"></span>
                        <span class="font-semibold text-brand-700" x-text="rate + '%'"></span>
                      </div>
                    </template>
                    <div x-show="!Object.keys(summary.insights.collection_by_section || {}).length" class="text-xs text-slate-400">
                      No section data
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Chart + collection rate + mini feed -->
            <div class="tilt-scene mt-6 grid gap-4 lg:grid-cols-3">
              <!-- Chart -->
              <div class="tilt-card grad-card rounded-2xl bg-white p-5 shadow-sm lg:col-span-1">
                <p class="mb-1 text-sm font-medium text-slate-700">Payment status</p>
                <p class="mb-3 text-xs text-slate-400"
                   x-text="activeClass
                   ? activeClass + ' · ' + section
                   : (section === 'all' ? 'Across all students' : section + ' section')"></p>
                <div class="relative mx-auto h-56">
                  <canvas x-ref="paidChart"></canvas>
                </div>
              </div>

              <!-- Collection progress + recent activity -->
              <div class="tilt-card grad-card rounded-2xl bg-white p-5 shadow-sm lg:col-span-2">
                <div class="mb-4">
                  <div class="mb-1 flex items-center justify-between">
                    <p class="text-sm font-medium text-slate-700">Collection rate</p>
                    <p class="text-sm font-semibold text-brand-700" x-text="summary.collection_rate + '%'"></p>
                  </div>
                  <div class="h-2.5 w-full overflow-hidden rounded-full bg-slate-100">
                    <div class="h-full rounded-full bg-brand-500 transition-all"
                         :style="`width: ${summary.collection_rate}%`"></div>
                  </div>
                  <p class="mt-1 text-xs text-slate-400">
                    <span x-text="summary.total_collected_display"></span> of
                    <span x-text="summary.total_expected_display"></span> collected
                  </p>
                </div>

                <div class="border-t border-slate-100 pt-4">
                  <div class="mb-3 flex items-center justify-between">
                    <p class="text-sm font-medium text-slate-700">Recent activity</p>
                    <button @click="$store.app.go('activity')"
                            class="text-xs font-medium text-brand-600 hover:underline">View all</button>
                  </div>
                  <p x-show="recent.length === 0" class="py-4 text-center text-sm text-slate-400">
                    No activity yet. Record a payment or send reminders to get started.
                  </p>
                  <ul class="space-y-3">
                    <template x-for="item in recent" :key="item.id">
                      <li class="flex items-start gap-3">
                        <span class="mt-0.5 text-base" x-text="activityIcon(item.action)"></span>
                        <div class="min-w-0">
                          <p class="text-sm text-slate-700" x-text="item.description"></p>
                          <p class="text-xs text-slate-400" x-text="timeAgo(item.created_at)"></p>
                        </div>
                      </li>
                    </template>
                  </ul>
                </div>
              </div>
            </div>

            <!-- Per-category breakdown: how each fee category is collecting,
                 school-wide. Only categories that have fee types assigned show.
                 Gradient border only (no tilt) — a wide data table must stay flat
                 and perfectly legible. -->
            <div class="grad-card mt-6 rounded-2xl bg-white p-5 shadow-sm">
              <p class="mb-1 text-sm font-medium text-slate-700">Collection by category</p>
              <p class="mb-4 text-xs text-slate-400">Every fee category, tracked school-wide.</p>

              <p x-show="!summary.categories || summary.categories.length === 0"
                 class="py-4 text-center text-sm text-slate-400">
                No fee categories with assigned fees yet. Add fee types on the Setup screen.
              </p>

              <div x-show="summary.categories && summary.categories.length" class="overflow-x-auto">
                <table class="min-w-full text-sm">
                  <thead>
                    <tr class="border-b border-slate-100 text-left text-xs uppercase tracking-wide text-slate-400">
                      <th class="px-3 py-2">Category</th>
                      <th class="px-3 py-2 text-right">Expected</th>
                      <th class="px-3 py-2 text-right">Collected</th>
                      <th class="px-3 py-2 text-right">Remaining</th>
                      <th class="px-3 py-2 text-right">Overpaid</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-50">
                    <template x-for="c in summary.categories" :key="c.category_id">
                      <tr>
                        <td class="px-3 py-2.5 font-medium text-slate-800" x-text="c.category_name"></td>
                        <td class="px-3 py-2.5 text-right text-slate-700" x-text="c.total_expected_display"></td>
                        <td class="px-3 py-2.5 text-right font-medium text-emerald-600" x-text="c.total_collected_display"></td>
                        <td class="px-3 py-2.5 text-right text-slate-700" x-text="c.total_remaining_display"></td>
                        <td class="px-3 py-2.5 text-right text-accent-600" x-text="c.total_overpaid_display"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>

            <!-- Class student list — only shown when drilled into a specific class -->
            <div x-show="activeClass !== null && classStudents.length > 0" x-cloak class="grad-card mt-6 rounded-2xl bg-white p-5 shadow-sm">
              <p class="mb-1 text-sm font-medium text-slate-700">
                Students in <span x-text="activeClass"></span>
              </p>
              <p class="mb-4 text-xs text-slate-400">
                <span x-text="classStudents.length"></span> student<span x-show="classStudents.length !== 1">s</span>
              </p>
              <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                  <thead>
                    <tr class="border-b border-slate-100 text-left text-xs uppercase tracking-wide text-slate-400">
                      <th class="px-3 py-2">Student</th>
                      <th class="px-3 py-2">Parent</th>
                      <th class="px-3 py-2 text-right">Total Fee</th>
                      <th class="px-3 py-2 text-right">Paid</th>
                      <th class="px-3 py-2 text-right">Remaining</th>
                      <th class="px-3 py-2">Status</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-50">
                    <template x-for="s in classStudents" :key="s.student_id">
                      <tr class="hover:bg-slate-50/60">
                        <td class="px-3 py-2.5 font-medium text-slate-800" x-text="s.student_name"></td>
                        <td class="px-3 py-2.5 text-slate-500" x-text="s.parent_name"></td>
                        <td class="px-3 py-2.5 text-right text-slate-700" x-text="s.total_fees_display"></td>
                        <td class="px-3 py-2.5 text-right font-medium text-emerald-600" x-text="s.amount_paid_display"></td>
                        <td class="px-3 py-2.5 text-right text-slate-700" x-text="s.remaining_display"></td>
                        <td class="px-3 py-2.5" x-html="statusBadge(s.status)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
            <div x-show="activeClass !== null && classStudents.length === 0" x-cloak class="grad-card mt-6 rounded-2xl bg-white p-5 shadow-sm">
              <p class="py-4 text-center text-sm text-slate-400">No students in <span x-text="activeClass"></span> yet.</p>
            </div>
          </div>
        </template>
      </section>

      <!-- ========================================================= -->
      <!-- ================= PARENTS SCREEN ======================== -->
      <!-- ========================================================= -->
      <section x-show="$store.app.screen === 'parents'" x-data="parents()">
        <div class="mb-5 flex items-start justify-between">
          <div>
            <h1 class="gradient-heading text-xl font-semibold">Parents &amp; Students</h1>
            <p class="text-sm text-slate-500">Search, check balances, and record payments.</p>
          </div>
          <button @click="openAdd()"
            class="btn-depress inline-flex items-center gap-1.5 rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700">
            <span class="text-base leading-none">＋</span> Add student
          </button>
        </div>

        <!-- Search + filter -->
        <div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center">
          <div class="relative flex-1">
            <input x-model="search" type="text" placeholder="Search by student, parent, or phone…"
              class="w-full rounded-xl border border-slate-200 bg-white py-2.5 pl-10 pr-3 text-sm shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
            <span class="pointer-events-none absolute left-3 top-2.5 text-slate-400">🔍</span>
          </div>
          <div class="flex gap-1 rounded-xl bg-slate-100 p-1">
            <template x-for="opt in [
                {id:'all', label:'All'},
                {id:'unpaid', label:'Unpaid'},
                {id:'partial', label:'Partial'},
                {id:'paid', label:'Paid'},
                {id:'overpaid', label:'Overpaid'},
                {id:'no_fee', label:'No fee set'}
              ]" :key="opt.id">
              <button @click="statusFilter = opt.id"
                :class="statusFilter === opt.id ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500'"
                class="rounded-lg px-3 py-1.5 text-sm font-medium transition"
                x-text="opt.label"></button>
            </template>
          </div>
        </div>

        <!-- Section filter -->
        <div class="mb-4 flex flex-wrap gap-1 rounded-xl bg-slate-100 p-1 sm:inline-flex">
          <template x-for="opt in [
              {id:'all', label:'All sections'},
              {id:'Preschool', label:'Preschool'},
              {id:'Primary', label:'Primary'},
              {id:'Smart Skills High School', label:'Smart Skills'}
            ]" :key="opt.id">
            <button @click="sectionFilter = opt.id"
              :class="sectionFilter === opt.id ? 'bg-white text-brand-700 shadow-sm' : 'text-slate-500'"
              class="flex-1 rounded-lg px-3 py-1.5 text-sm font-medium transition sm:flex-none"
              x-text="opt.label"></button>
          </template>
        </div>

        <!-- Loading -->
        <div x-show="loading" class="space-y-2">
          <template x-for="i in 5" :key="i">
            <div class="h-16 animate-pulse rounded-xl bg-slate-200/60"></div>
          </template>
        </div>

        <!-- Table (desktop) -->
        <div x-show="!loading" class="grad-card hidden overflow-hidden rounded-2xl bg-white shadow-sm sm:block">
          <table class="min-w-full divide-y divide-slate-100">
            <thead class="bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
              <tr>
                <th class="px-5 py-3">Student / Parent</th>
                <th class="px-5 py-3">Section</th>
                <th class="px-5 py-3">Phone</th>
                <th class="px-5 py-3 text-right">Total</th>
                <th class="px-5 py-3 text-right">Paid</th>
                <th class="px-5 py-3 text-right">Balance</th>
                <th class="px-5 py-3">Status</th>
                <th class="px-5 py-3"></th>
              </tr>
            </thead>
            <tbody class="divide-y divide-slate-50 text-sm">
              <template x-for="s in filtered" :key="s.student_id">
                <tr class="lift-row">
                  <td class="px-5 py-3 cursor-pointer" @click="openDetail(s.student_id)">
                    <p class="font-medium text-slate-900" x-text="s.student_name"></p>
                    <p class="text-xs text-slate-500">
                      <span x-text="s.parent_name"></span>
                      <span x-show="s.class_name" x-text="' · ' + s.class_name"></span>
                    </p>
                  </td>
                  <td class="px-5 py-3 text-slate-600" x-text="s.section"></td>
                  <td class="px-5 py-3 text-slate-600" x-text="s.parent_phone"></td>
                  <td class="px-5 py-3 text-right text-slate-600" x-text="s.total_fees_display"></td>
                  <td class="px-5 py-3 text-right text-emerald-600" x-text="s.amount_paid_display"></td>
                  <td class="px-5 py-3 text-right font-medium">
                    <!-- Overpaid → show the credit clearly. Otherwise show what's
                         left to complete (never a confusing negative number). -->
                    <template x-if="s.overpaid_kobo > 0">
                      <span class="text-accent-600" x-text="'Overpaid by ' + s.overpaid_display"></span>
                    </template>
                    <template x-if="s.overpaid_kobo === 0">
                      <span class="text-slate-900" x-text="s.remaining_display"></span>
                    </template>
                  </td>
                  <td class="px-5 py-3">
                    <span class="inline-flex rounded-full px-2.5 py-0.5 text-xs font-medium ring-1 ring-inset"
                          :class="statusBadge(s.status).cls" x-text="statusBadge(s.status).label"></span>
                  </td>
                  <td class="px-5 py-3 text-right">
                    <div class="inline-flex items-center gap-2">
                      <button @click="openPayLink(s)"
                        x-show="s.remaining_kobo > 0"
                        class="btn-depress rounded-lg bg-brand-600 px-3 py-1.5 text-xs font-semibold text-white hover:bg-brand-700">
                        Pay now
                      </button>
                      <button @click="openPayment(s)"
                        x-show="s.remaining_kobo > 0"
                        class="btn-depress rounded-lg bg-brand-50 px-3 py-1.5 text-xs font-semibold text-brand-700 hover:bg-brand-100">
                        Record payment
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
              <tr x-show="filtered.length === 0">
                <td colspan="8" class="px-5 py-10 text-center text-sm text-slate-400">No matching students.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Cards (mobile) -->
        <div x-show="!loading" class="tilt-scene space-y-3 sm:hidden">
          <template x-for="s in filtered" :key="s.student_id">
            <div class="tilt-card grad-card rounded-2xl bg-white p-4 shadow-sm">
              <div class="flex items-start justify-between" @click="openDetail(s.student_id)">
                <div>
                  <p class="font-medium text-slate-900" x-text="s.student_name"></p>
                  <p class="text-xs text-slate-500" x-text="s.section + ' · ' + s.parent_name + (s.class_name ? ' · ' + s.class_name : '')"></p>
                  <p class="mt-0.5 text-xs text-slate-400" x-text="s.parent_phone"></p>
                </div>
                <span class="inline-flex rounded-full px-2.5 py-0.5 text-xs font-medium ring-1 ring-inset"
                      :class="statusBadge(s.status).cls" x-text="statusBadge(s.status).label"></span>
              </div>
              <div class="mt-3 flex items-center justify-between border-t border-slate-100 pt-3">
                <div>
                  <template x-if="s.overpaid_kobo > 0">
                    <div>
                      <p class="text-xs text-slate-400">Overpaid</p>
                      <p class="font-semibold text-accent-600" x-text="s.overpaid_display"></p>
                    </div>
                  </template>
                  <template x-if="s.overpaid_kobo === 0">
                    <div>
                      <p class="text-xs text-slate-400">Remaining</p>
                      <p class="font-semibold text-slate-900" x-text="s.remaining_display"></p>
                    </div>
                  </template>
                </div>
                <div class="flex items-center gap-2">
                  <button @click="openPayLink(s)" x-show="s.remaining_kobo > 0"
                    class="btn-depress rounded-lg bg-brand-600 px-3 py-1.5 text-xs font-semibold text-white">
                    Pay now
                  </button>
                  <button @click="openPayment(s)" x-show="s.remaining_kobo > 0"
                    class="btn-depress rounded-lg bg-brand-50 px-3 py-1.5 text-xs font-semibold text-brand-700">
                    Record payment
                  </button>
                </div>
              </div>
            </div>
          </template>
          <p x-show="filtered.length === 0" class="py-10 text-center text-sm text-slate-400">No matching students.</p>
        </div>

        <!-- ============ DETAIL DRAWER ============ -->
        <div x-show="drawerOpen" x-cloak class="fixed inset-0 z-40" @keydown.escape.window="closeDetail()">
          <div class="absolute inset-0 bg-slate-900/30" @click="closeDetail()"></div>
          <div class="absolute right-0 top-0 flex h-full w-full max-w-md flex-col bg-white shadow-xl thin-scroll"
               x-transition:enter="transition ease-out duration-200"
               x-transition:enter-start="translate-x-full" x-transition:enter-end="translate-x-0">
            <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
              <h2 class="text-base font-semibold text-slate-900">Student record</h2>
              <button @click="closeDetail()" class="rounded-lg p-1 text-slate-400 hover:bg-slate-100">✕</button>
            </div>

            <div x-show="detailLoading" class="p-6 text-center text-sm text-slate-400">Loading…</div>

            <div x-show="!detailLoading && detail" class="flex-1 overflow-y-auto px-5 py-4 thin-scroll">
              <!-- Header -->
              <div class="rounded-xl bg-slate-50 p-4">
                <p class="text-lg font-semibold text-slate-900" x-text="detail?.student_name"></p>
                <p class="text-sm text-slate-500"
                   x-text="(detail?.section || '') + ' · ' + detail?.parent_name + (detail?.class_name ? ' · ' + detail?.class_name : '')"></p>
                <p class="text-sm text-slate-500" x-text="detail?.parent_phone"></p>
                <div class="mt-3 grid grid-cols-3 gap-2 text-center">
                  <div class="rounded-lg bg-white p-2">
                    <p class="text-xs text-slate-400">Total</p>
                    <p class="text-sm font-semibold" x-text="detail?.total_fees_display"></p>
                  </div>
                  <div class="rounded-lg bg-white p-2">
                    <p class="text-xs text-slate-400">Paid</p>
                    <p class="text-sm font-semibold text-emerald-600" x-text="detail?.amount_paid_display"></p>
                  </div>
                  <div class="rounded-lg bg-white p-2">
                    <template x-if="detail && detail.overpaid_kobo > 0">
                      <div>
                        <p class="text-xs text-slate-400">Overpaid</p>
                        <p class="text-sm font-semibold text-accent-600" x-text="detail?.overpaid_display"></p>
                      </div>
                    </template>
                    <template x-if="!detail || detail.overpaid_kobo === 0">
                      <div>
                        <p class="text-xs text-slate-400">Remaining</p>
                        <p class="text-sm font-semibold text-slate-700" x-text="detail?.remaining_display"></p>
                      </div>
                    </template>
                  </div>
                </div>
              </div>

              <!-- Drawer actions -->
              <div class="mt-4 grid grid-cols-3 gap-2">
                <button @click="openEdit()"
                  class="rounded-xl border border-slate-200 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50">
                  ✏️ Edit
                </button>
                <button @click="openAssign()"
                  class="rounded-xl border border-slate-200 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50">
                  ＋ Assign fee
                </button>
                <button @click="remindOne(detail.student_id)" :disabled="remindingId === detail?.student_id"
                  class="rounded-xl border border-slate-200 py-2 text-xs font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-50">
                  <span x-show="remindingId !== detail?.student_id">📩 Remind</span>
                  <span x-show="remindingId === detail?.student_id" x-cloak>Sending…</span>
                </button>
              </div>

              <!-- Fee lines -->
              <div class="mt-5">
                <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">Fees</p>
                <ul class="space-y-2">
                  <template x-for="f in detail?.fee_records || []" :key="f.fee_record_id">
                    <li class="flex items-center justify-between rounded-xl border border-slate-100 p-3">
                      <div>
                        <p class="text-sm font-medium text-slate-800" x-text="f.fee_name"></p>
                        <p class="text-xs text-slate-400" x-text="f.fee_term"></p>
                      </div>
                      <div class="text-right">
                        <template x-if="f.overpaid_kobo > 0">
                          <p class="text-sm font-semibold text-accent-600" x-text="'Overpaid ' + f.overpaid_display"></p>
                        </template>
                        <template x-if="f.overpaid_kobo === 0">
                          <p class="text-sm font-semibold text-slate-900" x-text="f.remaining_display + ' left'"></p>
                        </template>
                        <span class="inline-flex rounded-full px-2 py-0.5 text-[11px] font-medium ring-1 ring-inset"
                              :class="statusBadge(f.status).cls" x-text="statusBadge(f.status).label"></span>
                      </div>
                    </li>
                  </template>
                </ul>
              </div>

              <!-- Message history -->
              <div class="mt-5">
                <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">Message history</p>
                <p x-show="(detail?.messages || []).length === 0" class="text-sm text-slate-400">
                  No messages sent yet.
                </p>
                <ul class="space-y-3">
                  <template x-for="(m, i) in detail?.messages || []" :key="i">
                    <li class="flex items-start gap-3">
                      <span class="mt-0.5" x-text="activityIcon(m.action)"></span>
                      <div>
                        <p class="text-sm text-slate-700" x-text="m.description"></p>
                        <p class="text-xs text-slate-400" x-text="formatDateTime(m.created_at)"></p>
                      </div>
                    </li>
                  </template>
                </ul>
              </div>

              <!-- Payment history -->
              <div class="mt-5">
                <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-slate-400">Payments</p>

             @keydown.escape.window="closeAssign()">
          <div class="absolute inset-0 bg-slate-900/40" @click="closeAssign()"></div>
          <div class="relative w-full max-w-md rounded-t-2xl bg-white p-6 shadow-xl sm:rounded-2xl"

      <!-- ========================================================= -->

            <p class="text-sm text-slate-500">The academic terms your school runs. Fees, payments and reports all belong to a term.</p>

          <button @click="openCreate()"
            class="btn-depress inline-flex items-center gap-1.5 rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-brand-700">
            <span class="text-base leading-none">＋</span> New term

        </div>

        <!-- Loading -->
        <div x-show="loading" class="space-y-2">
          <template x-for="i in 3" :key="i">
            <div class="h-16 animate-pulse rounded-xl bg-slate-200/60"></div>
          </template>
        </div>

        <!-- Empty state -->
        <div x-show="!loading && items.length === 0"

          <p class="text-sm text-slate-500">No terms yet.</p>
          <p class="mt-1 text-xs text-slate-400">

          <button @click="openCreate()"
            class="btn-depress mt-4 inline-flex items-center gap-1.5 rounded-xl bg-brand-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-brand-700">

        </div>

          <table class="min-w-full divide-y divide-slate-100">
            <thead class="bg-slate-50 text-left text-xs font-semibold uppercase tracking-wide text-slate-500">
              <tr>
                <th class="px-5 py-3">Term</th>
                <th class="px-5 py-3">Dates</th>
                <th class="px-5 py-3 text-center">Fee types</th>

              </tr>
            </thead>
            <tbody class="divide-y divide-slate-50 text-sm">
              <template x-for="t in items" :key="t.id">
                <tr class="lift-row">
                  <td class="px-5 py-3">
                    <div class="flex items-center gap-2">
                      <span class="font-medium text-slate-900" x-text="t.name"></span>
                      <span x-show="t.is_current"
                        class="inline-flex rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold text-emerald-700 ring-1 ring-emerald-600/20">
                        Current
                      </span>
                    </div>
                  </td>
                  <td class="px-5 py-3 text-slate-600" x-text="dateRange(t)"></td>
                  <td class="px-5 py-3 text-center text-slate-600" x-text="t.fee_type_count"></td>
                  <td class="px-5 py-3">
                    <div class="flex items-center justify-end gap-1">
                      <button x-show="!t.is_current" @click="setCurrent(t)"
                        class="rounded-lg px-2 py-1 text-xs font-semibold text-brand-600 hover:bg-brand-50">
                        Make current
                      </button>
                      <button @click="openEdit(t)"
                        class="rounded-lg px-2 py-1 text-xs font-semibold text-slate-500 hover:bg-slate-100">
                        Edit
                      </button>
                      <button @click="remove(t)"
                        class="rounded-lg px-2 py-1 text-xs font-semibold text-slate-400 hover:bg-rose-50 hover:text-rose-600">
                        Delete
                      </button>
                    </div>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <!-- ============ CREATE / EDIT TERM MODAL ============ -->
        <div x-show="formOpen" x-cloak class="fixed inset-0 z-50 flex items-end justify-center sm:items-center"
             @keydown.escape.window="closeForm()">
          <div class="absolute inset-0 bg-slate-900/40" @click="closeForm()"></div>
          <div class="relative w-full max-w-md rounded-t-2xl bg-white p-6 shadow-xl sm:rounded-2xl"
               x-transition:enter="transition ease-out duration-200"
               x-transition:enter-start="translate-y-8 opacity-0" x-transition:enter-end="translate-y-0 opacity-100">
            <div class="mb-4 flex items-center justify-between">
              <h2 class="text-base font-semibold text-slate-900" x-text="editing ? 'Edit term' : 'New term'"></h2>
              <button @click="closeForm()" class="rounded-lg p-1 text-slate-400 hover:bg-slate-100">✕</button>
            </div>

            <div class="space-y-4">
              <div>
                <label class="mb-1 block text-sm font-medium text-slate-700">Term name</label>
                <input x-model="form.name" type="text" placeholder="e.g. First Term 2025/2026"
                  @keydown.enter="submitForm()"
                  class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
              </div>
              <div class="grid grid-cols-2 gap-3">
                <div>
                  <label class="mb-1 block text-sm font-medium text-slate-700">Start date</label>
                  <input x-model="form.start_date" type="date"
                    class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
                </div>
                <div>
                  <label class="mb-1 block text-sm font-medium text-slate-700">End date</label>
                  <input x-model="form.end_date" type="date"
                    class="w-full rounded-xl border border-slate-200 py-2.5 px-3 text-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20" />
                </div>
              </div>
              <label x-show="!editing" class="flex items-center gap-2 text-sm text-slate-700">
                <input type="checkbox" x-model="form.is_current"
                  class="h-4 w-4 rounded border-slate-300 text-brand-600 focus:ring-brand-500/30" />
